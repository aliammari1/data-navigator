hoistPattern:
  - "*"

blockExoticSubdeps: true

allowBuilds:
  '@bitdisaster/exe-icon-extractor': true
  '@parcel/watcher': true
  '@swc/core': true
  autoevals: true
  better-sqlite3: true
  better-sqlite3-multiple-ciphers: true
  core-js: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  msw: true
  node-llama-cpp: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  # Hocuspocus asks for v12 while the app uses v13. Keep one native SQLite
  # version so Electron's rebuild reaches the copy loaded by the LAN hub.
  "@hocuspocus/extension-sqlite>better-sqlite3": "13.0.3"
  # public-ip v8 removes the HTTP cache chain affected by GHSA-ch52-4w7c-c8xp.
  "is-online>public-ip": "8.0.0"
  # Reuse Electron's v5 downloader; v3 depends on the vulnerable got v11 cache chain.
  "app-builder-lib>@electron/get": "5.1.0"
  tar: ">=7.5.21"
  extract-zip: ">=2.0.2"
  fast-uri: ">=3.1.6"
  # CVE swap: image-size@1.x is unmaintained with known DoS advisories
  # (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr); the community fork
  # image-size-next is API-compatible and patched.
  image-size: "npm:image-size-next@1.2.2"
  nanoid: "5.1.16"
  linkify-it: ">=5.0.2 <6.0.0"
  shell-quote: ">=1.8.5"
  tmp: ">=0.2.6"
  qs: ">=6.16.0"
  "@xmldom/xmldom": ">=0.9.12"
  esbuild: ">=0.28.1"
  uuid: ">=11.1.1"
  "js-yaml@3": ">=3.15.2"
  "js-yaml@4": ">=4.3.2"
  vitest: ">=4.1.11 <5.0.0"
  "@vitest/mocker": ">=4.1.11 <5.0.0"
  "@vitest/browser": ">=4.1.11 <5.0.0"
  joi: ">=18.2.5"

minimumReleaseAgeExclude:
  - undici@6.28.1 || 7.29.1
  - fast-uri@4.1.5
  - brace-expansion@1.1.19 || 1.1.20 || 1.1.21 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.10 || 5.0.11 || 5.0.12
  - axios@1.20.0
