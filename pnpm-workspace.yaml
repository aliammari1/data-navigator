hoistPattern:
  - "*"

blockExoticSubdeps: false

allowBuilds:
  '@bitdisaster/exe-icon-extractor': true
  '@parcel/watcher': true
  '@swc/core': true
  autoevals: true
  better-sqlite3: true
  better-sqlite3-multiple-ciphers: true
  core-js: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  node-llama-cpp: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  tar: ">=7.5.21"
  "@vitest/browser": ">=4.1.10 <5.0.0"
  extract-zip: ">=2.0.2"
  fast-uri: ">=3.1.6"
  nanoid: ">=5.1.16"
  linkify-it: ">=5.0.2 <6.0.0"
  shell-quote: ">=1.8.5"
  tmp: ">=0.2.6"
  qs: ">=6.16.0"
  "@xmldom/xmldom": ">=0.9.12"
  esbuild: ">=0.28.1"
  uuid: ">=11.1.1"
