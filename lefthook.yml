# lefthook.yml
pre-commit:
  parallel: true
  commands:
    # 1. Biome: Format, lint, and organize imports on staged files
    biome:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc,css,md,yaml,yml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # 2. Secret Scanning: Prevents accidental credentials in staged diffs
    gitleaks:
      tags: security
      run: gitleaks git --staged --config .gitleaks.toml --verbose

    # 3. Typecheck: Project-wide verification whenever TypeScript files are touched
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck

pre-push:
  parallel: false
  commands:
    architecture:
      run: pnpm run check:architecture
    dependencies:
      run: pnpm run check:deps
    deadcode:
      run: pnpm run check:deadcode
    tests:
      run: pnpm run test
    storybook-build:
      run: pnpm run storybook:build
