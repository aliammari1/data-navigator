# facts: Release pipeline for data-navigator (private, offline-first Electron app). Changesets
# owns version+git-tag+GitHub Release on push to main; a needs-gated Windows job then builds and
# attaches the WiX .msi installer to that Release. The tag is created with GITHUB_TOKEN, which does NOT
# re-trigger electron-windows.yml's `on: push: tags` (GitHub loop-prevention safeguard), so the
# installer build is chained explicitly via `needs` + the changesets `published` output instead of by
# tag push. Third-party actions are SHA-pinned; first-party actions/* use major tags. No GGUF
# model download anywhere in this pipeline.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a half-done release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: grant nothing at the top level; each job opts into the minimum it needs.
permissions: {}

jobs:
  changesets:
    name: Version or release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    # Expose the changesets outcome so the Windows job only builds when a real
    # release was actually cut (a git tag + GitHub Release were created), plus the
    # exact `v<version>` tag the MSI must be attached to.
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      releaseTag: ${{ steps.tag.outputs.releaseTag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # lfs:false — changesets versioning needs full history (fetch-depth:0) but NOT
          # the ~636 MB of LFS models. The actual installer build runs in
          # electron-windows.yml (which checks out its own tree, also lfs:false), so
          # fetching LFS here only wasted the account's monthly LFS bandwidth.
          lfs: false

      - name: Set up pnpm
        # Third-party action: pinned to a 40-char commit SHA per supply-chain policy.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm version is read from the `packageManager` field in package.json
          # (the single source of truth). Specifying it here too is now a hard
          # error in pnpm/action-setup (ERR_PNPM_BAD_PM_VERSION).
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or GitHub Release
        id: changesets
        # Third-party action: pinned to a 40-char commit SHA per supply-chain policy.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version:app
          # Private root package: `changeset publish` skips npm and (privatePackages.tag=true)
          # creates the `v<version>` git tag + GitHub Release. No npm token needed.
          publish: pnpm run release
          title: "Release: version Data Navigator"
          commit: "Prepare a traceable Data Navigator release"
          commitMode: github-api
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Derive the `v<version>` tag changesets created (tool=root single private pkg,
      # so the tag is `v${version}`). Used as the MSI's target release.
      - name: Resolve release tag
        id: tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "releaseTag=v${version}" >> "$GITHUB_OUTPUT"

  # Build + attach the Windows installer to the Release that the changesets job just cut.
  # Chained via `needs` (not a tag-push trigger) because GITHUB_TOKEN-created tags
  # do not start new workflow runs. Calls the reusable Windows build in
  # electron-windows.yml so there is a single source of truth for the installer build.
  windows-msi:
    name: Build + publish Windows Installer
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    uses: ./.github/workflows/electron-windows.yml
    permissions:
      contents: write # attach the installer to the GitHub Release
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # write the provenance attestation
    with:
      release: true
      # Check out + attach the installer to the exact tag changesets created.
      release-tag: ${{ needs.changesets.outputs.releaseTag }}
    secrets: inherit
