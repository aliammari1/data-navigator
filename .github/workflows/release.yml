# facts: Release pipeline for data-navigator (offline-first Electron app). Changesets
# owns version+git-tag on push to main; security gates run first, then a draft Release
# receives signed installers and is published only after both builds pass. The tag is created with GITHUB_TOKEN, which does NOT
# re-trigger electron-windows.yml's `on: push: tags` (GitHub loop-prevention safeguard), so the
# installer build is chained explicitly via `needs` + the changesets `published` output instead of by
# tag push. Third-party actions are SHA-pinned; first-party actions/* use major tags. No GGUF
# model download anywhere in this pipeline.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a half-done release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: grant nothing at the top level; each job opts into the minimum it needs.
permissions: {}

jobs:
  security:
    name: Release security checks
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  osv:
    name: Release OSV lockfile scan
    uses: ./.github/workflows/osv-scanner.yml
    permissions:
      contents: read

  ci:
    name: Release CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  quality:
    name: Release quality checks
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  changesets:
    name: Version or release
    needs: [security, osv, ci, quality]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    # Expose the changesets outcome so installers only build when a real
    # release was cut (a version tag was created), plus the
    # exact `v<version>` tag the MSI must be attached to.
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      releaseTag: ${{ steps.tag.outputs.releaseTag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # lfs:false — changesets versioning needs full history (fetch-depth:0) but NOT
          # the ~636 MB of LFS models. The actual installer build runs in
          # electron-windows.yml (which checks out its own tree, also lfs:false), so
          # fetching LFS here only wasted the account's monthly LFS bandwidth.
          lfs: false

      - name: Set up pnpm
        # Third-party action: pinned to a 40-char commit SHA per supply-chain policy.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm version is read from the `packageManager` field in package.json
          # (the single source of truth). Specifying it here too is now a hard
          # error in pnpm/action-setup (ERR_PNPM_BAD_PM_VERSION).
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or version tag
        id: changesets
        # Third-party action: pinned to a 40-char commit SHA per supply-chain policy.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run release:version
          # Private root package: `changeset publish` skips npm and (privatePackages.tag=true)
          # creates the `v<version>` git tag. The release remains unpublished until the builds pass.
          publish: pnpm run release:publish
          title: "Release: version Data Navigator"
          commit: "Prepare a traceable Data Navigator release"
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Derive the `v<version>` tag changesets created (tool=root single private pkg,
      # so the tag is `v${version}`). Used as the MSI's target release.
      - name: Resolve release tag
        id: tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e 'const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(process.argv[1]); if (!m || (+m[1] < 1) || (+m[1] === 1 && +m[2] === 0 && +m[3] < 8)) { console.error("Releases before v1.0.8 are not supported by these gates."); process.exit(1); }' "$version"
          echo "releaseTag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Require verified source commit and push signed release tag
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_SIGNING_FINGERPRINT: ${{ secrets.GPG_SIGNING_FINGERPRINT }}
          GPG_SIGNING_EMAIL: ${{ secrets.GPG_SIGNING_EMAIL }}
          RELEASE_TAG: ${{ steps.tag.outputs.releaseTag }}
        run: |
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          if [ "$verified" != 'true' ]; then
            echo '::error::The release source commit must have a verified signature.'
            exit 1
          fi
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_SIGNING_FINGERPRINT" ] || [ -z "$GPG_SIGNING_EMAIL" ]; then
            echo '::error::GPG_PRIVATE_KEY, GPG_SIGNING_FINGERPRINT, and GPG_SIGNING_EMAIL are required.'
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          actual="$(gpg --batch --with-colons --fingerprint --list-secret-keys "$GPG_SIGNING_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')"
          if [ "$actual" != "$GPG_SIGNING_FINGERPRINT" ]; then
            echo '::error::The release GPG key does not match the pinned fingerprint.'
            exit 1
          fi
          # Changesets may report a created tag without retaining it in this checkout.
          # Replace a local tag only when one exists; a missing tag is the normal case.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag -d "$RELEASE_TAG"
          fi
          git -c user.name='Data Navigator Release' -c user.email="$GPG_SIGNING_EMAIL" -c user.signingkey="$GPG_SIGNING_FINGERPRINT" tag -s "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git tag -v "$RELEASE_TAG"
          if [ "$(git rev-parse "$RELEASE_TAG^{}")" != "$GITHUB_SHA" ]; then
            echo '::error::The signed release tag does not point to the validated source commit.'
            exit 1
          fi
          git push origin "$RELEASE_TAG"

  draft-release:
    name: Create draft GitHub Release
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changesets.outputs.releaseTag }}
          lfs: false

      - name: Require GitHub-verified signed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | select(.type == "tag") | .sha')"
          if [ -z "$tag_object" ]; then
            echo '::error::The release tag is not an annotated signed tag.'
            exit 1
          fi
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')"
          if [ "$verified" != 'true' ]; then
            echo '::error::GitHub has not verified the release tag signature.'
            exit 1
          fi
          target_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          commit_verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$target_commit" --jq '.commit.verification.verified')"
          if [ "$commit_verified" != 'true' ]; then
            echo '::error::The tagged source commit must have a GitHub-verified signature.'
            exit 1
          fi

      - name: Create draft with Changesets notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '$0 == "## " version {printing=1; next} printing && /^## / {exit} printing {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ## Windows signature and trust

          The Windows installers use a self-signed certificate for direct distribution
          to a known group of users. Windows does not trust this certificate by default.
          Before installing its public certificate, verify its SHA-256 fingerprint
          through a separate trusted channel with the publisher:
          `F184780D4E767EBCC49F61DF060023A0F7B69DBD0327EAEE54139AFDF0C31DE4`.
          The certificate is attached as `data-navigator-signing.cer`.

          ## Package signatures and release provenance

          All four installers have detached `.asc` signatures. The signed
          `release-provenance.json` records their SHA-256 hashes, tagged source
          commit, and GitHub Actions run. Verify the attached public key's
          fingerprint through a separate trusted channel before using it to
          check these signatures. This private repository uses publisher GPG
          signatures; GitHub-hosted artifact attestations are unavailable here.
          EOF
          gh release create "$RELEASE_TAG" --draft --verify-tag --notes-file release-notes.md

  # Build + attach the Windows installer to the draft Release.
  # Chained via `needs` (not a tag-push trigger) because GITHUB_TOKEN-created tags
  # do not start new workflow runs. Calls the reusable Windows build in
  # electron-windows.yml so there is a single source of truth for the installer build.
  windows-msi:
    name: Build + publish Windows Installer
    needs: [changesets, draft-release]
    if: needs.changesets.outputs.published == 'true'
    uses: ./.github/workflows/electron-windows.yml
    permissions:
      contents: write # attach the installer to the GitHub Release
    with:
      release: true
      # Check out + attach the installer to the exact tag changesets created.
      release-tag: ${{ needs.changesets.outputs.releaseTag }}
    secrets: inherit

  linux-package:
    name: Build + publish Linux Packages
    needs: [changesets, draft-release]
    if: needs.changesets.outputs.published == 'true'
    uses: ./.github/workflows/electron-linux.yml
    permissions:
      contents: write # attach the packages to the GitHub Release
    with:
      release: true
      # Check out + attach the packages to the exact tag changesets created.
      release-tag: ${{ needs.changesets.outputs.releaseTag }}
    secrets: inherit

  publish-release:
    name: Publish verified Release
    needs: [changesets, draft-release, windows-msi, linux-package]
    if: needs.changesets.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changesets.outputs.releaseTag }}
          lfs: false

      - name: Download and verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
          GPG_SIGNING_FINGERPRINT: ${{ secrets.GPG_SIGNING_FINGERPRINT }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo '::error::The release tag does not point to this gated source commit.'
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,assets > release.json
          jq -e '
            (.assets | length) as $assetCount |
            .isDraft == true and
            ($assetCount == (9 +
              ([.assets[].name | select(endswith(".msi.asc"))] | length) +
              ([.assets[].name | select(endswith(".exe.asc"))] | length) +
              ([.assets[].name | select(. == "release-provenance.json")] | length) +
              ([.assets[].name | select(. == "release-provenance.json.asc")] | length))) and
            ([.assets[].name | select(endswith(".msi"))] | length == 1) and
            ([.assets[].name | select(endswith(".exe"))] | length == 1) and
            ([.assets[].name | select(endswith(".AppImage"))] | length == 1) and
            ([.assets[].name | select(endswith(".deb"))] | length == 1) and
            ([.assets[].name | select(endswith(".AppImage.asc"))] | length == 1) and
            ([.assets[].name | select(endswith(".deb.asc"))] | length == 1) and
            (.assets | any(.name == "data-navigator-signing.cer")) and
            (.assets | any(.name == "release-signing-key.asc")) and
            (.assets | any(.name == "release-signing-key.fingerprint")) and
            ([.assets[].name | select(endswith(".msi.asc"))] | length <= 1) and
            ([.assets[].name | select(endswith(".exe.asc"))] | length <= 1) and
            ([.assets[].name | select(. == "release-provenance.json")] | length <= 1) and
            ([.assets[].name | select(. == "release-provenance.json.asc")] | length <= 1)
          ' release.json
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          while IFS=$'\t' read -r name digest; do
            if [[ ! "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
              echo "::error::Missing SHA-256 digest for $name"
              exit 1
            fi
            actual="$(sha256sum "release-assets/$name" | cut -d' ' -f1)"
            if [ "$actual" != "${digest#sha256:}" ]; then
              echo "::error::Release asset digest mismatch: $name"
              exit 1
            fi
          done < <(jq -r '.assets[] | [.name, .digest] | @tsv' release.json)
          if [ "$(cat release-assets/release-signing-key.fingerprint)" != "$GPG_SIGNING_FINGERPRINT" ]; then
            echo '::error::The published GPG fingerprint does not match the pinned key.'
            exit 1
          fi
          if [ "$(sha256sum release-assets/data-navigator-signing.cer | cut -d' ' -f1)" != 'f184780d4e767ebcc49f61df060023a0f7b69dbd0327eaee54139afdf0c31de4' ]; then
            echo '::error::The published Windows certificate does not match the pinned certificate.'
            exit 1
          fi
          mkdir -m 700 "$RUNNER_TEMP/release-gnupg"
          gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --import release-assets/release-signing-key.asc
          actual="$(gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --with-colons --fingerprint --list-keys | awk -F: '$1 == "pub" {count++} $1 == "fpr" && count == 1 && !first {first=$10} END {if (count != 1) exit 1; print first}')"
          if [ -z "$GPG_SIGNING_FINGERPRINT" ] || [ "$actual" != "$GPG_SIGNING_FINGERPRINT" ]; then
            echo '::error::The published GPG public key does not match the pinned fingerprint.'
            exit 1
          fi
          for package in release-assets/*.AppImage release-assets/*.deb; do
            gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --verify "$package.asc" "$package"
          done

      - name: Match Windows installers to verified build output
        env:
          MSI_NAME: ${{ needs.windows-msi.outputs.msi_name }}
          MSI_SHA256: ${{ needs.windows-msi.outputs.msi_sha256 }}
          EXE_NAME: ${{ needs.windows-msi.outputs.exe_name }}
          EXE_SHA256: ${{ needs.windows-msi.outputs.exe_sha256 }}
        run: |
          if [ -z "$MSI_NAME" ] || [ "$MSI_NAME" != "$(basename "$MSI_NAME")" ] || [[ "$MSI_NAME" != *.msi ]] ||
             [ -z "$EXE_NAME" ] || [ "$EXE_NAME" != "$(basename "$EXE_NAME")" ] || [[ "$EXE_NAME" != *.exe ]] ||
             [[ ! "$MSI_SHA256" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$EXE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::The verified Windows build did not provide valid installer digests.'
            exit 1
          fi
          if [ "$(sha256sum "release-assets/$MSI_NAME" | cut -d' ' -f1)" != "$MSI_SHA256" ] ||
             [ "$(sha256sum "release-assets/$EXE_NAME" | cut -d' ' -f1)" != "$EXE_SHA256" ]; then
            echo '::error::A Windows release asset differs from the Authenticode-verified build.'
            exit 1
          fi

      - name: Sign Windows installers and release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_SIGNING_FINGERPRINT: ${{ secrets.GPG_SIGNING_FINGERPRINT }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_SIGNING_FINGERPRINT" ]; then
            echo '::error::The release GPG key and pinned fingerprint are required.'
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --import
          actual="$(gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --with-colons --fingerprint --list-secret-keys "$GPG_SIGNING_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')"
          if [ "$actual" != "$GPG_SIGNING_FINGERPRINT" ]; then
            echo '::error::The signing key does not match the pinned fingerprint.'
            exit 1
          fi
          for package in release-assets/*.msi release-assets/*.exe; do
            gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --yes --armor --local-user "$GPG_SIGNING_FINGERPRINT" --detach-sign --output "$package.asc" "$package"
          done
          node scripts/release-provenance.mjs create release-assets release-assets/release-provenance.json
          gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --yes --armor --local-user "$GPG_SIGNING_FINGERPRINT" --detach-sign --output release-assets/release-provenance.json.asc release-assets/release-provenance.json
          gh release upload "$RELEASE_TAG" release-assets/*.msi.asc release-assets/*.exe.asc release-assets/release-provenance.json release-assets/release-provenance.json.asc --clobber

      - name: Verify published assets and signed provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          mkdir verification-assets
          gh release download "$RELEASE_TAG" --dir verification-assets
          diff -u <(cd release-assets && sha256sum ./* | sort) <(cd verification-assets && sha256sum ./* | sort)
          for package in verification-assets/*.msi verification-assets/*.exe verification-assets/*.AppImage verification-assets/*.deb; do
            gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --verify "$package.asc" "$package"
          done
          gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --verify verification-assets/release-provenance.json.asc verification-assets/release-provenance.json
          node scripts/release-provenance.mjs verify verification-assets verification-assets/release-provenance.json

      - name: Publish release after all gates pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
