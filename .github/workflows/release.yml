name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      channel:
        description: "Release channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - alpha

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CI: true
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  FORGE_PUBLISH: "true"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PRERELEASE: ${{ inputs.prerelease || 'false' }}
  CHANNEL: ${{ inputs.channel || 'stable' }}

jobs:
  publish-windows:
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run native:rebuild:electron

      - name: Run verification
        run: npm run verify

      - name: Publish with Electron Forge
        run: npm run electron:publish

      - name: Upload release build logs and output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-navigator-release-output
          path: |
            out/**
            *.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Attest release artifacts
        if: success()
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "out/**/*"
