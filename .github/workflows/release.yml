# Release pipeline for Data Navigator.
# Security/quality gates run first. Changesets owns versioning and the version tag.
# A draft release receives unsigned Windows and Linux packages. The final job
# validates SHA-256 digests and release provenance before publication.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  security:
    name: Release security checks
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  osv:
    name: Release OSV lockfile scan
    uses: ./.github/workflows/osv-scanner.yml
    permissions:
      contents: read

  ci:
    name: Release CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  quality:
    name: Release quality checks
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  changesets:
    name: Version or release
    needs: [security, osv, ci, quality]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      releaseTag: ${{ steps.tag.outputs.releaseTag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or version tag
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run release:version
          publish: pnpm run release:publish
          title: "Release: version Data Navigator"
          commit: "Prepare a traceable Data Navigator release"
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e 'const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(process.argv[1]); if (!m || (+m[1] < 1) || (+m[1] === 1 && +m[2] === 0 && +m[3] < 8)) { console.error("Releases before v1.0.8 are not supported by these gates."); process.exit(1); }' "$version"
          echo "releaseTag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag to GitHub
        if: steps.changesets.outputs.published == 'true'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.releaseTag }}
        run: |
          target="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo '::error::Changesets did not tag the gated source commit.'
            exit 1
          fi
          git push origin "refs/tags/$RELEASE_TAG"

  draft-release:
    name: Create draft GitHub Release
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.changesets.outputs.releaseTag }}
          lfs: false

      - name: Create draft with Changesets notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '$0 == "## " version {printing=1; next} printing && /^## / {exit} printing {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ## Release integrity

          Windows and Linux packages are distributed without publisher signatures.
          Verify downloaded files against the SHA-256 values recorded in
          `release-provenance.json` before use.
          EOF
          gh release create "$RELEASE_TAG" --draft --verify-tag --notes-file release-notes.md

  windows-msi:
    name: Build + publish Windows Installer
    needs: [changesets, draft-release]
    if: needs.changesets.outputs.published == 'true'
    uses: ./.github/workflows/electron-windows.yml
    permissions:
      contents: write
    with:
      release: true
      release-tag: ${{ needs.changesets.outputs.releaseTag }}
    secrets: inherit

  linux-package:
    name: Build + publish Linux Packages
    needs: [changesets, draft-release]
    if: needs.changesets.outputs.published == 'true'
    uses: ./.github/workflows/electron-linux.yml
    permissions:
      contents: write
    with:
      release: true
      release-tag: ${{ needs.changesets.outputs.releaseTag }}
    secrets: inherit

  publish-release:
    name: Publish verified Release
    needs: [changesets, draft-release, windows-msi, linux-package]
    if: needs.changesets.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.changesets.outputs.releaseTag }}
          lfs: false

      - name: Download and verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo '::error::The release tag does not point to this gated source commit.'
            exit 1
          fi

          gh release view "$RELEASE_TAG" --json isDraft,assets > release.json
          jq -e '
            .isDraft == true and
            (.assets | length == 4) and
            ([.assets[].name | select(endswith(".msi"))] | length == 1) and
            ([.assets[].name | select(endswith(".exe"))] | length == 1) and
            ([.assets[].name | select(endswith(".AppImage"))] | length == 1) and
            ([.assets[].name | select(endswith(".deb"))] | length == 1)
          ' release.json

          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets

          while IFS=$'\t' read -r name digest; do
            if [[ ! "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
              echo "::error::Missing SHA-256 digest for $name"
              exit 1
            fi
            actual="$(sha256sum "release-assets/$name" | cut -d' ' -f1)"
            if [ "$actual" != "${digest#sha256:}" ]; then
              echo "::error::Release asset digest mismatch: $name"
              exit 1
            fi
          done < <(jq -r '.assets[] | [.name, .digest] | @tsv' release.json)

      - name: Match Windows installers to build output
        env:
          MSI_NAME: ${{ needs.windows-msi.outputs.msi_name }}
          MSI_SHA256: ${{ needs.windows-msi.outputs.msi_sha256 }}
          EXE_NAME: ${{ needs.windows-msi.outputs.exe_name }}
          EXE_SHA256: ${{ needs.windows-msi.outputs.exe_sha256 }}
        run: |
          if [ -z "$MSI_NAME" ] || [ "$MSI_NAME" != "$(basename "$MSI_NAME")" ] || [[ "$MSI_NAME" != *.msi ]] ||
             [ -z "$EXE_NAME" ] || [ "$EXE_NAME" != "$(basename "$EXE_NAME")" ] || [[ "$EXE_NAME" != *.exe ]] ||
             [[ ! "$MSI_SHA256" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$EXE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::The Windows build did not provide valid installer digests.'
            exit 1
          fi

          if [ "$(sha256sum "release-assets/$MSI_NAME" | cut -d' ' -f1)" != "$MSI_SHA256" ] ||
             [ "$(sha256sum "release-assets/$EXE_NAME" | cut -d' ' -f1)" != "$EXE_SHA256" ]; then
            echo '::error::A Windows release asset differs from the verified workflow build.'
            exit 1
          fi

      - name: Create release provenance manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          node scripts/release-provenance.mjs create release-assets release-assets/release-provenance.json
          gh release upload "$RELEASE_TAG" release-assets/release-provenance.json --clobber

      - name: Verify published assets and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: |
          mkdir verification-assets
          gh release download "$RELEASE_TAG" --dir verification-assets
          diff -u <(cd release-assets && sha256sum ./* | sort) <(cd verification-assets && sha256sum ./* | sort)
          node scripts/release-provenance.mjs verify verification-assets verification-assets/release-provenance.json

      - name: Publish release after all gates pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changesets.outputs.releaseTag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
