# facts: data-navigator is a private (package.json private:true), offline-first Electron
# desktop app. This workflow is the security gate: dependency-review on PRs, a pnpm
# production-dependency audit + dead-code hygiene, secret scanning (gitleaks), and SAST
# (Semgrep OSS / Community Edition). No multi-GB GGUF model is ever downloaded in CI.
# Third-party actions are SHA-pinned; first-party actions/* use major tags. Least-privilege
# permissions per job.
#
# (CodeQL was removed — code scanning requires GitHub Advanced Security, which is not
# enabled on this repo, so it only ever errored. Semgrep OSS now provides SAST without
# Advanced Security; findings print in the job log and upload as a SARIF artifact rather
# than the Security tab. OpenSSF Scorecard and the weekly schedule were removed too.)
#
# gitleaks and semgrep run as installed binaries, NOT the marketing-gated gitleaks-action
# (which requires a paid GITLEAKS_LICENSE for org-owned repos) — same self-contained
# pattern as osv-scanner.yml's `go install`.
name: Security

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  merge_group:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: grant nothing at the top level; each job opts into the minimum it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Dependency review: blocks PRs that introduce vulnerable or disallowed-license
  # dependencies, and posts a summary comment. PR-only (needs the base..head diff).
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ---------------------------------------------------------------------------
  # Supply-chain hygiene: production-dependency vuln audit (mirrors the
  # audit:security package.json script) plus monorepo/package and dead-code
  # hygiene. Advisory checks stay non-blocking via continue-on-error.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Shared composite action: pnpm + Node 24 + pnpm-store/Next caches + install.
      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        # Mirrors `pnpm run audit:security` (pnpm audit --audit-level high --prod).
        # Advisory: don't fail the build on a transitive advisory with no fix yet;
        # dependency-review gates net-new vulnerable deps on PRs instead.
        run: pnpm run audit:security
        continue-on-error: true

      - name: Dead-code hygiene
        run: pnpm dlx knip
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Secret scanning: gitleaks over the checked-out working tree. Blocks the gate
  # when a credential-shaped, high-entropy string lands in source. Runs the
  # MIT-licensed gitleaks binary directly — the gitleaks-action wrapper needs a
  # paid GITLEAKS_LICENSE for org-owned repos; the CLI does not.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          # Pinned for reproducibility; bump deliberately.
          # Latest tags: https://github.com/gitleaks/gitleaks/releases
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        # `dir` scans files as-is (no git history) — highest signal, lowest noise.
        # --redact keeps real secret values out of logs and the SARIF artifact.
        # Exits non-zero (blocks) on any finding; tune the allowlist in .gitleaks.toml.
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact=100 \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SAST: Semgrep OSS (Community Edition) over first-party source (src, electron,
  # scripts) — mirrors the dependency-cruiser scope. Uses `semgrep scan` (the
  # stand-alone OSS path) with registry rule packs: no login token, not subject to
  # Semgrep AppSec Platform limits. Blocks on ERROR-severity (high-confidence)
  # findings only, to keep false positives out of the gate.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        # Unpinned: a scanner benefits from the latest engine + rules. Pin a
        # specific version here once you want fully reproducible SAST runs.
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep (OSS, no login)
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        # --severity ERROR + --error => block only on high-confidence findings.
        # To widen coverage to advisory: drop `--severity ERROR` and add
        # `continue-on-error: true`. `// nosemgrep: <rule-id>` suppresses one line.
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --metrics off \
            --severity ERROR \
            --error \
            --no-suppress-errors \
            --sarif --output semgrep.sarif \
            src electron scripts

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 7
