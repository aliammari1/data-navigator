# facts: data-navigator is a private (package.json private:true), offline-first Electron
# desktop app. This workflow is the lightweight security gate: dependency-review on PRs
# plus a pnpm production-dependency audit + dead-code hygiene. No multi-GB GGUF model is
# ever downloaded in CI. Third-party actions are SHA-pinned; first-party actions/* use
# major tags. Least-privilege permissions per job.
#
# (CodeQL was removed — code scanning requires GitHub Advanced Security, which is not
# enabled on this repo, so it only ever errored. OpenSSF Scorecard and the weekly
# schedule that fed both were removed too.)
name: Security

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  merge_group:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: grant nothing at the top level; each job opts into the minimum it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Dependency review: blocks PRs that introduce vulnerable or disallowed-license
  # dependencies, and posts a summary comment. PR-only (needs the base..head diff).
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ---------------------------------------------------------------------------
  # Supply-chain hygiene: production-dependency vuln audit (mirrors the
  # audit:security package.json script) plus monorepo/package and dead-code
  # hygiene. Advisory checks stay non-blocking via continue-on-error.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Shared composite action: pnpm + Node 24 + pnpm-store/Next caches + install.
      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        # Mirrors `pnpm run audit:security` (pnpm audit --audit-level high --prod).
        # Advisory: don't fail the build on a transitive advisory with no fix yet;
        # dependency-review gates net-new vulnerable deps on PRs instead.
        run: pnpm run audit:security
        continue-on-error: true

      - name: Dead-code hygiene
        run: pnpm dlx knip
        continue-on-error: true
