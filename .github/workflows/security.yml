name: Security

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  merge_group:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: grant nothing at top level; jobs declare what they need.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Dependency review: blocks PRs introducing vulnerable dependencies.
  # Note: requires GitHub Advanced Security (GHAS) if the GitHub repo itself is private.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Keep the public-repository PR gate read-only, including for forked PRs.
          comment-summary-in-pr: never

  # ---------------------------------------------------------------------------
  # Supply chain: audit production dependencies + dead-code hygiene
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm run audit:security
        continue-on-error: true

      - name: Dead-code hygiene
        run: pnpm dlx knip
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Secret scanning: Gitleaks inspecting Git commits rather than raw filesystem
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required for Gitleaks to inspect git commit objects
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git commits for secrets
        run: |
          # Determine git commit range based on trigger event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${{ github.event.before }}..${{ github.event.after }}"
          else
            LOG_OPTS="HEAD~1..HEAD"
          fi

          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact=100 \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SAST: Semgrep OSS scanning source code (src, electron, scripts)
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep (OSS, no login)
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --metrics off \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif \
            src electron scripts

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 7
