# facts: data-navigator is a private (package.json private:true), offline-first Electron
# desktop app. This workflow is the security gate: CodeQL (js/ts), dependency-review on
# PRs, pnpm audit (audit:security script), and OpenSSF Scorecard. No multi-GB GGUF model
# is ever downloaded in CI. Third-party actions are SHA-pinned; first-party actions/* and
# github/* use major tags. Least-privilege permissions per job. Assumes the shared composite
# action ./.github/actions/setup exists (added by the workflow-setup lane).
name: Security

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  merge_group:
  schedule:
    # Weekly, Monday 03:24 UTC. Keeps CodeQL + Scorecard fresh even without new commits.
    - cron: "24 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: grant nothing at the top level; each job opts into the minimum it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis (CodeQL) for JavaScript/TypeScript. build-mode: none because
  # this is an interpreted codebase (no compiled artifact needed for analysis).
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ---------------------------------------------------------------------------
  # Dependency review: blocks PRs that introduce vulnerable or disallowed-license
  # dependencies, and posts a summary comment. PR-only (needs the base..head diff).
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ---------------------------------------------------------------------------
  # Supply-chain hygiene: production-dependency vuln audit (mirrors the
  # audit:security package.json script) plus monorepo/package and dead-code
  # hygiene. Advisory checks stay non-blocking via continue-on-error.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Shared composite action: pnpm + Node 24 + pnpm-store/Next caches + install.
      # Added by the workflow-setup lane (see .github/actions/setup/action.yml).
      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        # Mirrors `pnpm run audit:security` (pnpm audit --audit-level high --prod).
        # Advisory: don't fail the build on a transitive advisory with no fix yet;
        # dependency-review gates net-new vulnerable deps on PRs instead.
        run: pnpm run audit:security
        continue-on-error: true

      - name: Package hygiene
        run: pnpm dlx sherif

      - name: Dead-code hygiene
        run: pnpm dlx knip
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # OpenSSF Scorecard: repository security-posture scoring. Runs on push to the
  # default branch and on schedule only (it scores branch protection, tokens,
  # workflow perms, etc. — not meaningful per-PR). Uploads SARIF to code scanning.
  # ---------------------------------------------------------------------------
  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write
      # Needed for the Scorecard publish/auth flow (read OIDC token).
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run analysis
        # SHA-PIN (third-party): verify/refresh this SHA at implementation time via
        #   gh api repos/ossf/scorecard-action/git/refs/tags/v2 --jq .object.sha
        # Dependabot (github-actions ecosystem) keeps it current after merge.
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Only publish results (public OpenSSF API) for the canonical repo on
          # scheduled runs; keep it off elsewhere so forks/branches don't publish.
          publish_results: false

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecard

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
