name: Electron Windows

# Build + release the Windows MSI for Data Navigator.
#
# Two modes:
#  - PR / manual smoke      -> build-only: prove the WiX MSI still MAKEs (no publish).
#  - Release (workflow_call) -> MAKE the MSI on windows-latest, upload it as a workflow
#    artifact AND attach it to the GitHub Release for the current version, with a signed
#    build-provenance attestation. update-electron-app consumes that Release.
#
# RELEASE TRIGGER: this workflow is CALLED by release.yml (workflow_call) after the
# changesets job cuts the version + git tag + GitHub Release. It is NOT triggered by
# `on: push: tags`, because the tag is created with GITHUB_TOKEN and GitHub deliberately
# does NOT start new workflow runs from GITHUB_TOKEN-pushed tags (loop-prevention). The
# `workflow_dispatch` input below also allows a manual release build.
#
# Offline-product note: the multi-GB GGUF model is intentionally NOT downloaded.
# forge.config.ts copies ./models only if it exists (copyDirIfExists), so CI
# builds a model-less MSI on purpose. Do not add a model-download step here.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "electron/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "forge.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-windows.yml"
  # Called by release.yml once a release has been cut; `release: true` flips this run
  # from build-only smoke into publish mode (attest + attach MSI to the Release).
  workflow_call:
    inputs:
      release:
        description: Build and publish the MSI to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the MSI is attached to.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish the MSI to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the MSI is attached to (e.g. v0.2.0).
        type: string
        required: false
        default: ""

# Release builds must never be cancelled mid-flight; PR smoke runs are cancellable.
concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the workflow level; jobs opt into exactly what they need.
permissions: {}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build Windows MSI
    # Pin to windows-2022, NOT windows-latest. windows-latest moved to the
    # windows-2025-vs2026 image where node-gyp cannot find Visual Studio 2026, so the
    # native rebuild step fails. windows-2022 ships VS 2022 + the WiX 3 toolset that
    # MakerWix shells out to — the proven environment for this native + WiX MSI build.
    runs-on: windows-2022
    timeout-minutes: 90

    permissions:
      contents: write # attach the MSI to the GitHub Release (release runs only)
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # write the provenance attestation

    # `release: true` (from workflow_call by release.yml, or a manual dispatch) makes
    # this the publish build; otherwise (PR / default dispatch) it is a build-only smoke.
    env:
      IS_RELEASE: ${{ inputs.release == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # lfs:false — do NOT fetch LFS objects. Every LFS-tracked file is an AI model
          # (*.onnx/*.bin/*.gguf/*.safetensors + public/models/**); this build is
          # intentionally model-less (models are downloaded at runtime), so it needs
          # none of them. Fetching ~636 MB of LFS on every run was pure waste and is
          # what exhausted the account's LFS bandwidth budget ("exceeded its LFS
          # budget"). The build-critical assets (public/icon.ico, etc.) are normal git
          # objects, not LFS.
          lfs: false
          # On a release, build from the exact tag changesets cut so the installer
          # matches the published version; otherwise build the event's default ref.
          ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm version is read from the `packageManager` field in package.json
          # (the single source of truth). Specifying it here too is now a hard
          # error in pnpm/action-setup (ERR_PNPM_BAD_PM_VERSION).
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Cache Electron binary downloads (electron-rebuild + @electron/get fetch the
      # matching Electron headers + the prebuilt Electron zip the packager extracts).
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # Cache the Next.js build cache to speed up `desktop:build` -> next build.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Install with node-linker=hoisted (flat, npm-style node_modules) — the OFFICIAL
      # Electron Forge + pnpm requirement (forge #4188): Forge crawls node_modules to
      # collect deps with naive resolution that does NOT follow pnpm's isolated .pnpm
      # symlink store. Scoped to THIS packaging install via --config so the repo's
      # dev/test installs stay isolated; a clean runner has no prior node_modules to
      # conflict, and the flag changes only on-disk layout (not lockfile resolution),
      # so --frozen-lockfile still holds.
      - name: Install dependencies (hoisted node_modules for forge)
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Confirm hoisted node_modules
        shell: pwsh
        run: |
          if (Test-Path node_modules/.pnpm) {
            Write-Host "::warning::node_modules/.pnpm present — node-linker=hoisted did NOT apply"
          } else {
            Write-Host "node_modules is flat (hoisted) — no .pnpm store"
          }

      # Rebuild native modules for the Electron 42 ABI in a DEDICATED step, BEFORE make.
      # forge.config.ts no longer carries a rebuildConfig: forge's in-`make` rebuild
      # spawned a node-gyp child PER native module, which on the hosted runner both hung
      # ("Preparing native dependencies", forge #3474/#3619) AND triggered the early
      # process.exit(0) that killed make ~4s in. Rebuilding here means `make` never
      # spawns a rebuild child, and the staged .node files already carry the right ABI.
      - name: Rebuild native modules for Electron ABI
        run: pnpm run native:rebuild
        env:
          NODE_ENV: production

      # Typecheck only — NOT the full `pnpm run verify`. The MSI artifact only
      # needs to compile + package; the heavy quality suite (lint, tests, coverage,
      # Storybook build, size budgets) already runs on the same commit in
      # quality.yml / storybook.yml and must not gate or slow the release artifact.
      # `electron:make` runs `desktop:build` (next build) itself, so build coverage
      # is preserved. A failing Storybook/coverage/size gate no longer blocks the MSI.
      - name: Typecheck
        run: pnpm run typecheck

      # Build the Next standalone + Electron main bundle as its own step, so the
      # forge `make` below runs as a fresh process we can trace in isolation.
      - name: Build desktop bundle
        run: pnpm run desktop:build
        env:
          NODE_ENV: production

      # Belt-and-suspenders: skip forge's check-system (it spawns a pnpm child). The
      # in-process make below bypasses the CLI entirely, but keep this so no forge code
      # path spawns that child. windows-2022 already has VS 2022 + WiX 3 and the install
      # is hoisted, so the check is unneeded. forge documents this skip file in its log.
      - name: Skip forge system check (avoid the pnpm child it spawns)
        shell: pwsh
        run: New-Item -ItemType File -Force -Path "$HOME/.skip-forge-system-check" | Out-Null

      # Make the Windows installer (Squirrel Setup.exe) via forge's PROGRAMMATIC
      # api.make() (scripts/forge-make.mjs),
      # NOT `electron-forge make`. The CLI uses commander external-executable subcommands,
      # so `electron-forge make` spawns a separate electron-forge-make.js child that, on
      # this runner, exits 0 mid extract-zip (event-loop drain) and the dispatcher
      # forwards the exit -> no .msi (confirmed via --trace-exit: ChildProcess.onexit ->
      # process.exit). api.make() runs in ONE process (no child to lose), and the script's
      # ref'd keep-alive timer prevents the loop draining during extraction. --trace-exit
      # stays on to catch any residual process.exit; Verify (if: always()) is the gate.
      - name: Make Windows installer
        shell: bash
        run: node scripts/forge-make.mjs 2>&1 | cat
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--trace-exit"
          DEBUG: "electron-forge:*,electron-packager,@electron/get*,extract-zip"
          FORCE_COLOR: "0"

      # Ground-truth what `make` actually produced AND dump diagnostics, since the
      # make silently exits 0 with no out/. We print: the out/ tree, how far Electron
      # packaging got (the electron-packager temp template dir), whether the Electron
      # download landed in the @electron/get cache, disk free, and any stray .msi near
      # the build. Targeted paths only (no whole-drive scan -> fast). Then hard-fail
      # if there is no real MSI.
      - name: Verify installer was produced
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          function Dump($label, $path, $depth) {
            Write-Host "`n===== $label : $path ====="
            if (Test-Path $path) {
              Get-ChildItem $path -Recurse -Depth $depth |
                Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,2)}}, LastWriteTime, FullName |
                Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
            } else { Write-Host "(does not exist)" }
          }
          Dump "out tree" "out" 4
          # @electron/packager extracts Electron into a temp template dir before copying
          # the app; its contents reveal whether extraction even completed.
          foreach ($t in @("$env:RUNNER_TEMP\electron-packager", "$env:TEMP\electron-packager", "$env:LOCALAPPDATA\Temp\electron-packager")) { Dump "electron-packager temp" $t 1 }
          Dump "electron download cache" "$env:LOCALAPPDATA\electron\Cache" 2
          Write-Host "`n===== disk free ====="
          Get-PSDrive C, D | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table -AutoSize | Out-String | Write-Host
          # Look for any .msi ONLY where one could plausibly be (out/ + packager temp).
          # NEVER recurse node_modules — it's huge, slow, and never holds an .msi.
          Write-Host "`n===== .msi files (out/ + electron-packager temp only) ====="
          @("out", "$env:RUNNER_TEMP\electron-packager", "$env:TEMP\electron-packager") |
            ForEach-Object { if (Test-Path $_) { Get-ChildItem -Path $_ -Filter *.msi -Recurse -ErrorAction SilentlyContinue } } |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host

          # Squirrel emits out/make/squirrel.windows/<arch>/<Setup>.exe + a -full.nupkg
          # + RELEASES. The Setup .exe is the installer; require at least one.
          $exes = @(Get-ChildItem -Recurse -Path out/make -Filter *.exe -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            Write-Host "::error::No Setup .exe was produced under out/make — the Squirrel maker did not run."
            exit 1
          }
          foreach ($e in $exes) {
            Write-Host "INSTALLER: $($e.FullName)  ($([math]::Round($e.Length/1MB,1)) MB)"
          }

      # Build a verifiable supply-chain provenance attestation over the MSI(s),
      # even for this private app (defense-in-depth). First-party action -> major tag.
      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "out/make/squirrel.windows/**/*.exe"

      # Attach the Squirrel installer to the GitHub Release changesets created for this
      # version. Attach the WHOLE squirrel.windows output — Setup.exe + the -full.nupkg
      # + RELEASES — because update-electron-app / the autoUpdater read RELEASES + the
      # nupkg from the Release to deliver updates, not just the Setup.exe.
      # tag_name is the explicit `v<version>` tag (NOT github.ref, which is the caller's
      # branch during a workflow_call); softprops updates that existing draft Release.
      - name: Attach installer to GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release-tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            out/make/squirrel.windows/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always upload the installer as a workflow artifact (build record + PR download).
      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-navigator-windows-setup
          path: |
            out/make/squirrel.windows/**/*
          if-no-files-found: warn
          retention-days: ${{ env.IS_RELEASE == 'true' && 30 || 14 }}
