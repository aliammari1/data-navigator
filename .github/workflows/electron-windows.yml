name: Electron Windows

# Build + release the Windows WiX MSI installer for Data Navigator.
#
# Two modes:
#  - PR / manual smoke      -> build-only: prove the WiX .msi still builds (no publish).
#  - Release (workflow_call) -> MAKE the installer on windows-latest, upload it as a workflow
#    artifact AND attach it to the GitHub Release for the current version. The gated
#    release job signs the installers and records their hashes in a signed manifest.
#
# Toolchain: @electron-forge/maker-wix shells out to candle.exe + light.exe from the WiX
# Toolset v3, so the "Install WiX Toolset v3" step must put them on PATH before the make.
#
# RELEASE TRIGGER: this workflow is CALLED by release.yml (workflow_call) after the
# changesets job cuts the version + git tag + GitHub Release. It is NOT triggered by
# `on: push: tags`, because the tag is created with GITHUB_TOKEN and GitHub deliberately
# does NOT start new workflow runs from GITHUB_TOKEN-pushed tags (loop-prevention). The
# `workflow_dispatch` input below also allows a manual release build.
#
# Offline-product note: the multi-GB GGUF model is intentionally NOT downloaded.
# forge.config.ts copies ./models only if it exists (copyDirIfExists), so CI
# builds a model-less installer on purpose. Do not add a model-download step here.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "electron/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "electron-builder.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-windows.yml"
  # Called by release.yml once a release has been cut; `release: true` flips this run
  # from build-only smoke into publish mode (sign + attach installers to the Release).
  workflow_call:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to.
        type: string
        required: false
        default: ""
    outputs:
      msi_name:
        description: Filename of the verified MSI.
        value: ${{ jobs.build.outputs.msi_name }}
      msi_sha256:
        description: SHA-256 of the verified MSI.
        value: ${{ jobs.build.outputs.msi_sha256 }}
      exe_name:
        description: Filename of the verified EXE.
        value: ${{ jobs.build.outputs.exe_name }}
      exe_sha256:
        description: SHA-256 of the verified EXE.
        value: ${{ jobs.build.outputs.exe_sha256 }}
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      signing-test:
        description: Build and verify signed installers on main without publishing.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to (e.g. v1.0.0).
        type: string
        required: false
        default: ""

# Release builds must never be cancelled mid-flight; PR smoke runs are cancellable.
concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the workflow level; jobs opt into exactly what they need.
permissions: {}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      msi_name: ${{ steps.verified_installers.outputs.msi_name }}
      msi_sha256: ${{ steps.verified_installers.outputs.msi_sha256 }}
      exe_name: ${{ steps.verified_installers.outputs.exe_name }}
      exe_sha256: ${{ steps.verified_installers.outputs.exe_sha256 }}

    permissions:
      contents: write # attach the MSI to the GitHub Release (release runs only)

    # `release: true` (from workflow_call by release.yml, or a manual dispatch) makes
    # this the publish build; otherwise (PR / default dispatch) it is a build-only smoke.
    env:
      IS_RELEASE: ${{ inputs.release == true || inputs.signing-test == true }}
      # PR/manual smoke builds favor speed: one NSIS installer, store compression,
      # and no WiX/typecheck duplication. Release builds retain the full installer set.
      FAST_WINDOWS_SMOKE: ${{ inputs.release != true && inputs.signing-test != true }}

    steps:
      - name: Require gated release workflow
        if: inputs.release == true && (github.workflow != 'Release' || github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch'))
        run: |
          Write-Host '::error::Release publication must run through the gated Release workflow.'
          exit 1

      - name: Require main branch for signing test
        if: inputs.signing-test == true && (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main' || inputs.release == true || inputs.release-tag != '')
        run: |
          Write-Host '::error::Signing tests run only as a nonpublishing manual dispatch on main.'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # lfs:false — do NOT fetch LFS objects. Every LFS-tracked file is an AI model
          # (*.onnx/*.bin/*.gguf/*.safetensors + public/models/**); this build is
          # intentionally model-less (models are downloaded at runtime), so it needs
          # none of them. Fetching ~636 MB of LFS on every run was pure waste and is
          # what exhausted the account's LFS bandwidth budget ("exceeded its LFS
          # budget"). The build-critical assets (public/icon.ico, etc.) are normal git
          # objects, not LFS.
          lfs: false
          # On a release, build from the exact tag changesets cut so the installer
          # matches the published version; otherwise build the event's default ref.
          ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm version is read from the `packageManager` field in package.json
          # (the single source of truth). Specifying it here too is now a hard
          # error in pnpm/action-setup (ERR_PNPM_BAD_PM_VERSION).
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Cache Electron binary downloads (electron-rebuild + @electron/get fetch the
      # matching Electron headers + the prebuilt Electron zip the packager extracts).
      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # Cache electron-builder toolsets (NSIS, winCodeSign, 7zip, etc.) so ephemeral
      # GitHub runners do not re-download them on every packaging run.
      - name: Cache electron-builder toolsets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      # Cache node-gyp headers/libraries. Native SQLite packages otherwise download
      # the same Node headers again on every clean Windows runner.
      - name: Cache node-gyp headers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/node-gyp/Cache
          key: node-gyp-${{ runner.os }}-node24
          restore-keys: |
            node-gyp-${{ runner.os }}-

      # Cache the Next.js build cache to speed up `desktop:build` -> next build.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Install dependencies with frozen lockfile
      - name: Install dependencies
        # Prefer the restored pnpm store while still fetching anything genuinely missing.
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set up Windows signing certificate
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD -or -not $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            throw 'The Windows signing certificate, password, and pinned thumbprint are required for release signing.'
          }
          New-Item -ItemType Directory -Force certs | Out-Null
          $certPath = Join-Path $PWD 'certs/windows-code-signing.pfx'
          [System.IO.File]::WriteAllBytes(
            $certPath,
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          Write-Host 'Windows signer: PFX decoded; reading end-entity certificate.'
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = (Get-PfxData -FilePath $certPath -Password $password).EndEntityCertificates | Select-Object -First 1
          Write-Host 'Windows signer: end-entity certificate read.'
          if (-not $certificate -or $certificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT -or
              $certificate.Thumbprint -ne '1956F63398744EF3D2A88348371753B60A3F1390') {
            throw 'The Windows signing certificate does not match the pinned thumbprint.'
          }
          if ($certificate.NotBefore -gt (Get-Date) -or $certificate.NotAfter -lt (Get-Date)) {
            throw 'The Windows signing certificate is not currently valid.'
          }
          $rootCert = Join-Path $PWD '.github/certs/data-navigator-signing-root.cer'
          if ((Get-FileHash -Path $rootCert -Algorithm SHA256).Hash -ne
              '7237D443A8D69F6146A95FEE4B4CEF8ADB50801457226FB8501CB634C80BD138') {
            throw 'The private signing root does not match the pinned public certificate.'
          }
          Write-Host 'Windows signer: pinned root hash verified; importing root.'
          # The runner is ephemeral. Trust the pinned private CA, then require
          # Windows to validate the leaf's signature and chain against it.
          & certutil.exe -user -f -addstore Root $rootCert
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not import the pinned signing root into the current-user store.'
          }
          if (-not (Test-Path 'Cert:\CurrentUser\Root\12B05CA207AA2CC9A71BC391F4D0B4265FEEA002')) {
            throw 'The pinned signing root is absent from the current-user store after import.'
          }
          Write-Host 'Windows signer: root imported; building code-signing chain.'
          $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
          try {
            $chain.ChainPolicy.ApplicationPolicy.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            $chain.ChainPolicy.UrlRetrievalTimeout = [TimeSpan]::FromSeconds(15)
            $chainValid = $chain.Build($certificate)
            Write-Host "Windows signer: chain built; valid=$chainValid; elements=$($chain.ChainElements.Count)."
            if (-not $chainValid) {
              $statuses = ($chain.ChainStatus | ForEach-Object { "$($_.Status): $($_.StatusInformation.Trim())" }) -join '; '
              throw "The signing certificate chain is invalid: $statuses"
            }
            if ($chain.ChainElements.Count -ne 2 -or
                $chain.ChainElements[1].Certificate.Thumbprint -ne '12B05CA207AA2CC9A71BC391F4D0B4265FEEA002') {
              throw 'The signing certificate does not chain to the pinned private root.'
            }
          } finally {
            $chain.Dispose()
          }

      # WiX Toolset v3 for MSI packaging
      - name: Install WiX Toolset v3
        # NSIS-only smoke builds do not need WiX. Keep it for release builds that emit MSI.
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX already available: $((Get-Command candle.exe).Source)"
          } else {
            choco install wixtoolset --version=3.14.0 -y --no-progress
            $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
            if (-not (Test-Path "$wixBin\candle.exe")) {
              # Fall back to whatever WiX v3 dir Chocolatey actually created.
              $found = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v*" -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
              if ($found) { $wixBin = Join-Path $found.FullName "bin" }
            }
            if (-not (Test-Path "$wixBin\candle.exe")) {
              Write-Host "::error::WiX Toolset v3 install failed — candle.exe not found under '$wixBin'"
              exit 1
            }
            Write-Host "Adding WiX to PATH: $wixBin"
            Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          }

      # Typecheck is already a blocking Tier-1 CI gate on pull requests. Avoid doing it
      # twice in the fast packaging smoke, but retain the check for release builds.
      - name: Typecheck
        if: env.IS_RELEASE == 'true'
        run: pnpm run typecheck

      # Build the Next standalone + Electron main bundle
      - name: Build desktop bundle
        run: pnpm run desktop:build
        env:
          NODE_ENV: production

      # PR smoke uses an unsigned build. Validate the signed release branch of
      # electron-builder's configuration separately so schema drift fails here.
      - name: Validate release signing configuration
        run: node scripts/validate-release-signing-config.mjs

      # Fast PR/manual smoke: build one NSIS EXE; electron-builder.config.ts selects
      # store compression from FAST_WINDOWS_SMOKE. Release builds use normal compression.
      - name: Make Windows installer
        shell: pwsh
        run: |
          if ($env:FAST_WINDOWS_SMOKE -eq 'true') {
            pnpm exec electron-builder --config electron-builder.config.ts --win nsis --x64 --publish never
          } else {
            pnpm exec electron-builder --config electron-builder.config.ts --win --x64 --publish never
          }
        env:
          NODE_ENV: production
          FORCE_COLOR: "0"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify Windows installer signatures
        id: verified_installers
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $msis = @(Get-ChildItem -Path dist -File -Filter *.msi)
          $exes = @(Get-ChildItem -Path dist -File -Filter *.exe)
          if ($msis.Count -ne 1 -or $exes.Count -ne 1) { throw 'Expected exactly one signed MSI and EXE installer.' }
          $installers = @($msis[0], $exes[0])
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            Write-Host "Signature status for $($installer.Name): $($signature.Status); message: $($signature.StatusMessage); signer: $($signature.SignerCertificate.Thumbprint)"
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Invalid or unpinned Authenticode signature on $($installer.FullName): $($signature.Status)"
            }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "msi_name=$($msis[0].Name)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "msi_sha256=$((Get-FileHash $msis[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe_name=$($exes[0].Name)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe_sha256=$((Get-FileHash $exes[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())"

      # Verify Windows installer was produced in dist/
      - name: Verify installer was produced
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          function Dump($label, $path, $depth) {
            Write-Host "`n===== $label : $path ====="
            if (Test-Path $path) {
              Get-ChildItem $path -Recurse -Depth $depth |
                Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,2)}}, LastWriteTime, FullName |
                Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
            } else { Write-Host "(does not exist)" }
          }
          Dump "dist tree" "dist" 4
          Write-Host "`n===== disk free ====="
          Get-PSDrive C, D | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "`n===== Windows packages in dist/ ====="
          Get-ChildItem -Path dist -Include *.msi, *.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host

          $installers = @(Get-ChildItem -Path dist -Include *.msi, *.exe -Recurse -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            Write-Host "::error::No .msi or .exe installer was produced under dist/."
            exit 1
          }
          foreach ($m in $installers) {
            Write-Host "INSTALLER: $($m.FullName)  ($([math]::Round($m.Length/1MB,1)) MB)"
          }

      # Attach the Windows installers to the GitHub Release
      - name: Attach installer to GitHub Release
        if: inputs.release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.msi', '.exe' } | Select-Object -ExpandProperty FullName)
          if ($installers.Count -ne 2) { throw 'Expected one MSI and one EXE release asset.' }
          $certificate = Join-Path $PWD '.github/certs/data-navigator-signing-root.cer'
          gh release upload $env:RELEASE_TAG @installers $certificate --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
