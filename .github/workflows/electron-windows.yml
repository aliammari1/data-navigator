name: Electron Windows

# Build + release the Windows MSI for Data Navigator.
#
# Two modes:
#  - PR / manual smoke      -> build-only: prove the WiX MSI still MAKEs (no publish).
#  - Release (workflow_call) -> MAKE the MSI on windows-latest, upload it as a workflow
#    artifact AND attach it to the GitHub Release for the current version, with a signed
#    build-provenance attestation. update-electron-app consumes that Release.
#
# RELEASE TRIGGER: this workflow is CALLED by release.yml (workflow_call) after the
# changesets job cuts the version + git tag + GitHub Release. It is NOT triggered by
# `on: push: tags`, because the tag is created with GITHUB_TOKEN and GitHub deliberately
# does NOT start new workflow runs from GITHUB_TOKEN-pushed tags (loop-prevention). The
# `workflow_dispatch` input below also allows a manual release build.
#
# Offline-product note: the multi-GB GGUF model is intentionally NOT downloaded.
# scripts/stage-app.mjs copies ./models only if it exists, so CI builds a
# model-less installer on purpose. Do not add a model-download step here.

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "electron/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "electron-builder.config.cjs"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-windows.yml"
  # Called by release.yml once a release has been cut; `release: true` flips this run
  # from build-only smoke into publish mode (attest + attach MSI to the Release).
  workflow_call:
    inputs:
      release:
        description: Build and publish the MSI to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the MSI is attached to.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish the MSI to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the MSI is attached to (e.g. v0.2.0).
        type: string
        required: false
        default: ""

# Release builds must never be cancelled mid-flight; PR smoke runs are cancellable.
concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the workflow level; jobs opt into exactly what they need.
permissions: {}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build Windows MSI
    # Pin to windows-2022, NOT windows-latest. windows-latest moved to the
    # windows-2025-vs2026 image, where node-gyp cannot find Visual Studio 2026 so
    # the native rebuild (better-sqlite3 / @duckdb / node-llama-cpp) fails.
    # windows-2022 ships VS 2022 + the WiX 3 toolset electron-builder's MSI target
    # shells out to — the proven environment for this native + WiX build.
    runs-on: windows-2022
    timeout-minutes: 90

    permissions:
      contents: write # attach the MSI to the GitHub Release (release runs only)
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # write the provenance attestation

    # `release: true` (from workflow_call by release.yml, or a manual dispatch) makes
    # this the publish build; otherwise (PR / default dispatch) it is a build-only smoke.
    env:
      IS_RELEASE: ${{ inputs.release == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
          # On a release, build from the exact tag changesets cut so the MSI matches
          # the published version; otherwise build the event's default ref (PR head).
          ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm version is read from the `packageManager` field in package.json
          # (the single source of truth). Specifying it here too is now a hard
          # error in pnpm/action-setup (ERR_PNPM_BAD_PM_VERSION).
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Cache Electron + electron-builder binary downloads (electron-rebuild /
      # electron-builder fetch the matching Electron headers + prebuilt binaries).
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # Cache the Next.js build cache to speed up `desktop:build` -> next build.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck only — NOT the full `pnpm run verify`. The installer artifact only
      # needs to compile + package; the heavy quality suite (lint, tests, coverage)
      # already runs on the same commit in quality.yml and must not gate or slow the
      # release artifact. `desktop:build` (below) runs next build itself, so build
      # coverage is preserved. A failing coverage/size gate no longer blocks the MSI.
      - name: Typecheck
        run: pnpm run typecheck

      # Rebuild the native modules for the Electron ABI (electron-builder's npmRebuild
      # is off). Mirrors the old forge rebuildConfig.onlyModules; must run BEFORE the
      # bundle is staged so the staged .node files carry the Electron-42 ABI.
      - name: Rebuild native modules for Electron ABI
        run: pnpm run native:rebuild
        env:
          NODE_ENV: production

      # build (next + workers) + prepare:standalone + tsup + stage:app. stage:app emits
      # the real-file ./app (Next standalone) and ./build/node_modules that electron-
      # builder packs verbatim — it never walks pnpm's isolated/symlinked store.
      - name: Build desktop bundle
        run: pnpm run desktop:build
        env:
          NODE_ENV: production

      # Package with electron-builder -> dist/*.exe (NSIS) + dist/*.msi. Runs IN-PROCESS
      # (no spawned child subcommand, unlike `electron-forge make`, whose child exited
      # mid-extraction on this runner). --publish never: no GitHub calls here; the
      # release attach happens below.
      - name: Build Windows installer (electron-builder)
        run: pnpm exec electron-builder --win --x64 --publish never --config electron-builder.config.cjs
        env:
          NODE_ENV: production
          # electron-builder spawns a child "node module collector" that walks the
          # production dependency graph. On pnpm's isolated .pnpm store (a deep symlink
          # web of hundreds of packages) it blows the default ~2 GB heap (exit 134,
          # "JavaScript heap out of memory"). Its result is discarded anyway — files[]
          # excludes root node_modules and we ship pre-staged real-file trees — but it
          # still runs, so give the child (which inherits NODE_OPTIONS) room to finish.
          # windows-2022 runners have 16 GB RAM, so 8 GB heap is safe headroom.
          NODE_OPTIONS: "--max-old-space-size=8192"

      # Ground-truth what electron-builder produced; hard-fail loudly if no installer.
      # CRITICAL: count ONLY root-level dist/*.exe + dist/*.msi (the NSIS / MSI
      # installers). Do NOT recurse — dist/win-unpacked/electron.exe is the raw Electron
      # runtime, not an installer, and a recursive match there silently green-lights a
      # run where the installer-assembly (NSIS/WiX) step actually failed.
      - name: Verify installer was produced
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Write-Host "===== dist/ root ====="
          if (Test-Path dist) {
            Get-ChildItem dist -File | Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,2)}}, Name | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
          } else { Write-Host "dist/ does NOT exist" }
          $a = @(Get-ChildItem -Path 'dist\*.exe', 'dist\*.msi' -File -ErrorAction SilentlyContinue)
          if ($a.Count -eq 0) { Write-Host "::error::No installer (.exe/.msi) was produced at dist/ root"; exit 1 }
          foreach ($f in $a) { Write-Host "INSTALLER: $($f.FullName)  ($([math]::Round($f.Length/1MB,1)) MB)" }

      # Supply-chain provenance attestation over the installer(s). First-party -> major tag.
      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.exe
            dist/*.msi

      # Attach the installer to the GitHub Release changesets created for this version.
      # fail_on_unmatched_files:false so a dropped MSI target (NSIS-only) still attaches.
      - name: Attach installer to GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release-tag }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always upload the installer as a workflow artifact (build record + PR download).
      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-navigator-windows-installer
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: warn
          retention-days: ${{ env.IS_RELEASE == 'true' && 30 || 14 }}
