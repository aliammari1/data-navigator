name: Electron Windows Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "forge.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-windows.yml"
  workflow_dispatch:

concurrency:
  group: electron-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    name: Package Windows app
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm run native:rebuild:electron

      - name: Verify
        run: pnpm run verify

      - name: Package Electron app
        run: pnpm run electron:package
        env:
          NODE_ENV: production

      - name: Upload packaged app
        uses: actions/upload-artifact@v5
        with:
          name: data-navigator-windows-package
          path: |
            out/**
          if-no-files-found: error
          retention-days: 14
