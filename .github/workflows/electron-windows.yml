name: Electron Windows

# Build + release the Windows MSI for Data Navigator.
#
# Two modes:
#  - PR / manual smoke      -> build-only: prove the WiX MSI still MAKEs (no publish).
#  - Release (workflow_call) -> MAKE the MSI on windows-latest, upload it as a workflow
#    artifact AND attach it to the GitHub Release for the current version, with a signed
#    build-provenance attestation. update-electron-app consumes that Release.
#
# RELEASE TRIGGER: this workflow is CALLED by release.yml (workflow_call) after the
# changesets job cuts the version + git tag + GitHub Release. It is NOT triggered by
# `on: push: tags`, because the tag is created with GITHUB_TOKEN and GitHub deliberately
# does NOT start new workflow runs from GITHUB_TOKEN-pushed tags (loop-prevention). The
# `workflow_dispatch` input below also allows a manual release build.
#
# Offline-product note: the multi-GB GGUF model is intentionally NOT downloaded.
# forge.config.ts copies ./models only if it exists (copyDirIfExists), so CI
# builds a model-less MSI on purpose. Do not add a model-download step here.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "electron/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "forge.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-windows.yml"
  # Called by release.yml once a release has been cut; `release: true` flips this run
  # from build-only smoke into publish mode (attest + attach MSI to the Release).
  workflow_call:
    inputs:
      release:
        description: Build and publish the MSI to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the MSI is attached to.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish the MSI to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the MSI is attached to (e.g. v0.2.0).
        type: string
        required: false
        default: ""

# Release builds must never be cancelled mid-flight; PR smoke runs are cancellable.
concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the workflow level; jobs opt into exactly what they need.
permissions: {}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build Windows MSI
    # Pin to windows-2022, NOT windows-latest. windows-latest moved to the
    # windows-2025-vs2026 image, where node-gyp cannot find Visual Studio 2026
    # (native installs fail) and @electron/packager dies mid-extraction of the
    # Electron zip — the make exits 0 having produced no out/ and no .msi.
    # windows-2022 ships VS 2022 + the WiX 3 toolset, the proven environment this
    # WiX MSI build was written for.
    runs-on: windows-2022
    timeout-minutes: 90

    permissions:
      contents: write # attach the MSI to the GitHub Release (release runs only)
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # write the provenance attestation

    # `release: true` (from workflow_call by release.yml, or a manual dispatch) makes
    # this the publish build; otherwise (PR / default dispatch) it is a build-only smoke.
    env:
      IS_RELEASE: ${{ inputs.release == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
          # On a release, build from the exact tag changesets cut so the MSI matches
          # the published version; otherwise build the event's default ref (PR head).
          ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm version is read from the `packageManager` field in package.json
          # (the single source of truth). Specifying it here too is now a hard
          # error in pnpm/action-setup (ERR_PNPM_BAD_PM_VERSION).
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Cache Electron + electron-builder binary downloads (electron-rebuild /
      # forge fetch the matching Electron headers + prebuilt binaries on make).
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # Cache the Next.js build cache to speed up `desktop:build` -> next build.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: no explicit `native:rebuild:electron` step. Forge rebuildConfig
      # (force:true in forge.config.ts) rebuilds better-sqlite3 / @duckdb /
      # sherpa-onnx-node / sqlite-vec / node-llama-cpp during make. Adding an
      # explicit step would reference a script that does not exist in package.json.

      # Typecheck only — NOT the full `pnpm run verify`. The MSI artifact only
      # needs to compile + package; the heavy quality suite (lint, tests, coverage,
      # Storybook build, size budgets) already runs on the same commit in
      # quality.yml / storybook.yml and must not gate or slow the release artifact.
      # `electron:make` runs `desktop:build` (next build) itself, so build coverage
      # is preserved. A failing Storybook/coverage/size gate no longer blocks the MSI.
      - name: Typecheck
        run: pnpm run typecheck

      # Always exercise the real WiX MSI maker used by releases (out/make/wix/x64/*.msi).
      #
      # CRITICAL: pipe through `cat` so Forge's stdout is NOT a TTY. `electron-forge
      # make` hard-codes `interactive: true` (see @electron-forge/cli
      # electron-forge-make.js), so listr2 uses its INTERACTIVE renderer. Under the
      # runner's TTY that renderer mis-syncs and the make process exits ~0.7s into
      # extracting the Electron zip — exit 0, no out/, no .msi (silently green).
      # Forcing a non-TTY stdout makes listr2 fall back to its line renderer and the
      # full package + WiX maker run to completion. bash here gets `-o pipefail`
      # (GitHub default), so a real Forge failure still fails the step.
      - name: Make Windows MSI
        shell: bash
        run: pnpm run electron:make 2>&1 | cat
        env:
          NODE_ENV: production
          DEBUG: electron-forge:*
          FORCE_COLOR: "0"

      # Ground-truth what `make` actually produced. The WiX maker writes the MSI to
      # out/make/wix/x64/*.msi; if that is empty the build silently shipped nothing,
      # so make this an explicit, loud gate instead of a warn-and-pass.
      - name: Verify MSI was produced
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== out/ tree ==="
          if (Test-Path out) {
            Get-ChildItem -Recurse out -ErrorAction SilentlyContinue |
              Select-Object @{n='Size(MB)';e={[math]::Round($_.Length/1MB,2)}}, FullName |
              Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
          } else {
            Write-Host "out/ does NOT exist"
          }
          $msis = @(Get-ChildItem -Recurse -Path out -Filter *.msi -ErrorAction SilentlyContinue)
          if ($msis.Count -eq 0) {
            Write-Error "No .msi was produced under out/ — the WiX maker did not run."
            exit 1
          }
          foreach ($m in $msis) {
            Write-Host "MSI: $($m.FullName)  ($([math]::Round($m.Length/1MB,1)) MB)"
          }

      # Build a verifiable supply-chain provenance attestation over the MSI(s),
      # even for this private app (defense-in-depth). First-party action -> major tag.
      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "out/make/**/*.msi"

      # Attach the MSI to the GitHub Release changesets created for this version.
      # tag_name is the explicit `v<version>` tag (NOT github.ref, which is the caller's
      # branch during a workflow_call); softprops updates that existing draft Release.
      - name: Attach MSI to GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release-tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always upload the MSI as a workflow artifact (build record + PR download).
      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-navigator-windows-msi
          path: |
            out/make/**/*.msi
          if-no-files-found: warn
          retention-days: ${{ env.IS_RELEASE == 'true' && 30 || 14 }}
