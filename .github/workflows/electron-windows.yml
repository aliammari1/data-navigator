name: Electron Windows Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "forge.config.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/electron-windows.yml"
  workflow_dispatch:

concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    name: Package Windows app
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run native:rebuild:electron

      - name: Verify
        run: npm run verify

      - name: Package Electron app
        run: npm run electron:package

      - name: Upload packaged app
        uses: actions/upload-artifact@v5
        with:
          name: data-navigator-windows-package
          path: |
            out/**
          if-no-files-found: error
          retention-days: 14
