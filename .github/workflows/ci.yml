name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: "1"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        node:
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package hygiene
        run: pnpm dlx sherif

      - name: Check unused dependencies
        run: pnpm dlx knip
        continue-on-error: true

      - name: Lint
        run: pnpm run lint

      - name: Oxlint
        run: pnpm dlx oxlint .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check provider boundaries
        run: pnpm run check:providers

      - name: Check architecture
        run: pnpm run check:architecture

      - name: Unit tests
        run: pnpm run test

      - name: Storybook build
        run: pnpm run build:storybook

      - name: Remove heavy runtime assets from Storybook build
        run: |
          rm -rf storybook-static/models
          rm -rf storybook-static/vad

      - name: Next build
        run: pnpm run build
