name: Storybook

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "src/**"
      - "features/**"
      - "components/**"
      - ".storybook/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**/*.stories.*"
      - "src/**/*.mdx"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_FIGMA_FILE_URL: ${{ vars.STORYBOOK_FIGMA_FILE_URL }}
  STORYBOOK_FIGMA_BUTTON_NODE_ID: ${{ vars.STORYBOOK_FIGMA_BUTTON_NODE_ID }}
  STORYBOOK_FIGMA_EMPTY_NODE_ID: ${{ vars.STORYBOOK_FIGMA_EMPTY_NODE_ID }}

jobs:
  storybook:
    name: Build and test Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build:storybook

      - name: Remove heavy runtime assets from Storybook artifact
        run: |
          rm -rf storybook-static/models
          rm -rf storybook-static/vad

      - name: Upload Storybook static build
        uses: actions/upload-artifact@v5
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: error
          retention-days: 7
