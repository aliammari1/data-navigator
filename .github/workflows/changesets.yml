# facts: PR-time validation gate for data-navigator (private, offline-first Electron app).
# Asserts every PR to main carries a changeset (or is intentionally version-neutral) via
# `changeset:status --since=origin/main`. Read-only; no release/tag/MSI side effects.
# Third-party pnpm/action-setup is SHA-pinned; first-party actions/* use major tags.
name: Changesets

on:
  pull_request:
    branches:
      - main

concurrency:
  group: changesets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main --depth=1

      - name: Set up pnpm
        # Third-party action: pinned to a 40-char commit SHA per supply-chain policy.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changesets
        run: pnpm run changeset:status -- --since=origin/main
