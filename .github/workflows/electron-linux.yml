name: Electron Linux

# Build + release the Linux AppImage and Debian (.deb) packages for Data Navigator.
#
# Two modes:
#  - PR / manual smoke      -> build-only: prove the Linux packages still build (no publish).
#  - Release (workflow_call) -> MAKE the packages on ubuntu-latest, upload them as workflow
#    artifacts AND attach them to the GitHub Release for the current version, with a signed
#    build-provenance attestation.
#
# Offline-product note: multi-GB GGUF models are intentionally NOT downloaded.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "electron/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "electron-builder.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-linux.yml"
  workflow_call:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to (e.g. v0.2.0).
        type: string
        required: false
        default: ""

concurrency:
  group: electron-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write # attach the packages to the GitHub Release (release runs only)
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # write the provenance attestation

    env:
      IS_RELEASE: ${{ inputs.release == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false
          ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up GPG signing key
        run: |
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
            echo "Imported secret GPG key."
          else
            echo "Generating CI signing GPG key..."
            gpg --batch --passphrase "" --quick-generate-key "Ali Ammari <ammari.ali.0001@gmail.com>" default default never
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build desktop bundle
        run: pnpm run desktop:build
        env:
          NODE_ENV: production

      - name: Make Linux packages (.AppImage + .deb)
        run: pnpm run package:linux
        env:
          NODE_ENV: production
          FORCE_COLOR: "0"

      - name: Verify packages were produced
        run: |
          echo "===== Linux packages in dist/ ====="
          ls -lh dist/
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          if [ ! -f "${appimages[0]}" ] || [ ! -f "${debs[0]}" ]; then
            echo "::error::Linux package (.AppImage or .deb) was not produced under dist/."
            exit 1
          fi
          echo "AppImage: ${appimages[0]}"
          echo "Debian:   ${debs[0]}"

      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - name: Attach packages to GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release-tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.AppImage.asc
            dist/*.deb.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-navigator-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.AppImage.asc
            dist/*.deb.asc
          if-no-files-found: warn
          retention-days: ${{ env.IS_RELEASE == 'true' && 30 || 14 }}
