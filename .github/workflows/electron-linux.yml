name: Electron Linux

# Build + release the Linux AppImage and Debian (.deb) packages for Data Navigator.
#
# Two modes:
#  - PR / manual smoke      -> build-only: prove the Linux packages still build (no publish).
#  - Release (workflow_call) -> MAKE the packages on ubuntu-latest and attach them
#    to the GitHub Release for the current version.
#
# Offline-product note: multi-GB GGUF models are intentionally NOT downloaded.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "electron/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "electron-builder.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-linux.yml"
  workflow_call:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to (e.g. v1.0.0).
        type: string
        required: false
        default: ""

concurrency:
  group: electron-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write # attach the packages to the GitHub Release (release runs only)

    env:
      IS_RELEASE: ${{ inputs.release == true }}

    steps:
      - name: Require gated release workflow
        if: inputs.release == true && (github.workflow != 'Release' || github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch'))
        run: |
          echo '::error::Release publication must run through the gated Release workflow.'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build desktop bundle
        run: pnpm run desktop:build
        env:
          NODE_ENV: production

      - name: Make Linux packages (.AppImage + .deb)
        run: pnpm exec electron-builder --config electron-builder.config.ts --linux --x64 --publish never
        env:
          NODE_ENV: production
          FORCE_COLOR: "0"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packages were produced
        run: |
          echo "===== Linux packages in dist/ ====="
          ls -lh dist/
          shopt -s nullglob
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one AppImage and one .deb package under dist/."
            exit 1
          fi
          echo "AppImage: ${appimages[0]}"
          echo "Debian:   ${debs[0]}"
      - name: Attach packages to GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.AppImage dist/*.deb --clobber
