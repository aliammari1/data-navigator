name: Electron Linux

# Build + release the Linux AppImage and Debian (.deb) packages for Data Navigator.
#
# Two modes:
#  - PR / manual smoke      -> build-only: prove the Linux packages still build (no publish).
#  - Release (workflow_call) -> MAKE the packages on ubuntu-latest, upload them as workflow
#    artifacts AND attach them to the GitHub Release for the current version, with a signed
#    build-provenance attestation.
#
# Offline-product note: multi-GB GGUF models are intentionally NOT downloaded.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "electron/**"
      - "build/**"
      - "public/**"
      - "scripts/**"
      - "electron-builder.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/electron-linux.yml"
  workflow_call:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish the installer to the GitHub Release.
        type: boolean
        required: false
        default: false
      release-tag:
        description: The `v<version>` tag whose GitHub Release the installer is attached to (e.g. v1.0.0).
        type: string
        required: false
        default: ""

concurrency:
  group: electron-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write # attach the packages to the GitHub Release (release runs only)
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # write the provenance attestation

    env:
      IS_RELEASE: ${{ inputs.release == true }}

    steps:
      - name: Require gated release workflow
        if: inputs.release == true && github.workflow != 'Release'
        run: |
          echo '::error::Release publication must run through the gated Release workflow.'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false
          ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_SIGNING_FINGERPRINT: ${{ secrets.GPG_SIGNING_FINGERPRINT }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "Imported secret GPG key."
            if [ "$IS_RELEASE" = 'true' ]; then
              actual="$(gpg --batch --with-colons --fingerprint --list-secret-keys "$GPG_SIGNING_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')"
              if [ -z "$GPG_SIGNING_FINGERPRINT" ] || [ "$actual" != "$GPG_SIGNING_FINGERPRINT" ]; then
                echo '::error::The release GPG key does not match GPG_SIGNING_FINGERPRINT.'
                exit 1
              fi
              gpg --batch --armor --export "$GPG_SIGNING_FINGERPRINT" > release-signing-key.asc
              test -s release-signing-key.asc
            fi
          elif [ "$IS_RELEASE" = 'true' ]; then
            echo '::error::GPG_PRIVATE_KEY is required for release signing.'
            exit 1
          else
            echo "Generating CI signing GPG key for build-only smoke..."
            gpg --batch --passphrase "" --quick-generate-key "Ali Ammari <ammari.ali.0001@gmail.com>" default default never
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build desktop bundle
        run: pnpm run desktop:build
        env:
          NODE_ENV: production

      - name: Make Linux packages (.AppImage + .deb)
        run: pnpm exec electron-builder --config electron-builder.config.ts --linux --x64 --publish never
        env:
          NODE_ENV: production
          FORCE_COLOR: "0"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_ID: ${{ secrets.GPG_SIGNING_FINGERPRINT }}

      - name: Verify packages were produced
        env:
          GPG_SIGNING_FINGERPRINT: ${{ secrets.GPG_SIGNING_FINGERPRINT }}
        run: |
          echo "===== Linux packages in dist/ ====="
          ls -lh dist/
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          if [ ! -f "${appimages[0]}" ] || [ ! -f "${debs[0]}" ]; then
            echo "::error::Linux package (.AppImage or .deb) was not produced under dist/."
            exit 1
          fi
          echo "AppImage: ${appimages[0]}"
          echo "Debian:   ${debs[0]}"
          if [ "$IS_RELEASE" = 'true' ]; then
            for package in "${appimages[0]}" "${debs[0]}"; do
              test -f "$package.asc"
              gpg --batch --verify "$package.asc" "$package"
            done
            cp release-signing-key.asc dist/release-signing-key.asc
            printf '%s\n' "$GPG_SIGNING_FINGERPRINT" > dist/release-signing-key.fingerprint
          fi

      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - name: Attach packages to GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.AppImage dist/*.deb dist/*.AppImage.asc dist/*.deb.asc \
            dist/release-signing-key.asc dist/release-signing-key.fingerprint --clobber

      - name: Upload Linux artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-navigator-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.AppImage.asc
            dist/*.deb.asc
          if-no-files-found: warn
          retention-days: ${{ env.IS_RELEASE == 'true' && 30 || 14 }}
