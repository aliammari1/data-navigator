name: Quality

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  merge_group:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: grant nothing at the top level; each job opts into the minimum.
permissions: {}

env:
  CI: "true"
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # THE required PR gate: static analysis, type/arch/provider checks, tests, and
  # the Next + Storybook builds.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node:
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up pnpm + Node + caches
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Lint (biome)
        run: pnpm run lint

      - name: Format check (biome)
        run: pnpm run format:check

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Architecture check
        run: pnpm run check:architecture

      - name: Dependency graph check (dependency-cruiser)
        run: pnpm run check:deps

      - name: Dead-code check (knip)
        run: pnpm run check:deadcode
        continue-on-error: true

      - name: Unit tests + coverage gate
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Offline-LLM eval harness (deterministic)
        run: pnpm run test:eval

      - name: Mutation testing (Stryker)
        run: pnpm run test:mutation
        continue-on-error: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-node-${{ matrix.node }}
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 7

      - name: Storybook build + story audit
        run: pnpm run build:storybook

      - name: Strip heavy runtime assets from Storybook build
        run: |
          rm -rf storybook-static/models
          rm -rf storybook-static/vad

      - name: Next build
        run: pnpm run build