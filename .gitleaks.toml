title = "Data Navigator Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Ignore test suites, fixtures, local evals, and mock tokens"
paths = [
  '''^\.e2e-electron-profile/.*''',
  '''^tests?/.*''',
  '''^evals/.*''',
  '''^graphify-out/.*''',
  '''^scripts/.*''',
  '''DailyTransactions_.*\.csv'''
]
regexes = [
  '''(?i)mock[-_]?token''',
  '''(?i)test[-_]?secret''',
  '''(?i)dummy[-_]?key''',
  '''[a-f0-9]{32,64}'''
]
