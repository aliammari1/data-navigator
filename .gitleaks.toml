title = "Data Navigator Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Ignore known non-secret generated/test literals and non-production fixtures"
paths = [
  '''(^|/)tests?/''',
  '''(^|/)evals/''',
  '''(^|/)scripts/''',
  '''(^|/)\.next/''',
  '''(^|/)build/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)storybook-static/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
]
regexes = [
  '''(?i)(qwen|granite|lfm|q[0-9]+_[a-z0-9_]+)''',
]

# Historical false positive in a generated Marpit bundle. This is the fixed
# alphabet used to generate CSS scope IDs, not a credential. Scope the
# exception to the generic-api-key rule and the exact source line only.
[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "Ignore Marpit CSS scope alphabet constant in historical export worker"
regexTarget = "line"
regexes = [
  '''^\s*var uniqKeyChars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";\s*$'''
]
